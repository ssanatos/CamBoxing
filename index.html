<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카메라 복싱</title>
<style>
:root{--bg:#0e0b0a;--chalk:#f3efe6;--red:#e5372c;--tape:#f6c21a;--dim:#a39b8d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--chalk);overflow:hidden;
 font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{display:flex;align-items:center;justify-content:center}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
canvas{display:block;background:#000}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
 padding:20px;text-align:center;overflow:auto;
 background:radial-gradient(ellipse 55% 45% at 50% 22%,rgba(246,194,26,.25),transparent 70%),
  radial-gradient(ellipse 90% 40% at 50% 115%,rgba(229,55,44,.4),transparent 70%),rgba(12,9,8,.94)}
#menu.hide{display:none}
.glove{font-size:clamp(44px,8vw,72px);line-height:1;filter:drop-shadow(0 12px 12px #000);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.glove{animation:none}}
h1{margin:0;font-size:clamp(52px,12vw,118px);font-weight:900;letter-spacing:-.04em;line-height:.95;
 transform:perspective(700px) rotateX(16deg);
 text-shadow:0 1px 0 #d8d2c4,0 2px 0 #c2bcae,0 3px 0 #aaa597,0 4px 0 #8f8a7d,0 5px 0 #6d6a60,0 6px 0 #4a4842,0 14px 22px rgba(0,0,0,.75)}
h1 span{color:var(--red);text-shadow:0 1px 0 #ff7a6c,0 2px 0 #c4231a,0 3px 0 #a81d15,0 4px 0 #8a1710,0 5px 0 #6a110c,0 6px 0 #4a0b08,0 14px 22px rgba(0,0,0,.75),0 0 44px rgba(229,55,44,.6)}
#msg{margin:0;min-height:1.5em;font-size:18px;max-width:30em;line-height:1.5;color:#e6e1d4}
.panel{display:flex;flex-direction:column;gap:12px;padding:18px 22px;border:1px solid rgba(243,239,230,.18);border-radius:16px;
 background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
 box-shadow:0 24px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.lab{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:800;font-size:17px;color:var(--chalk);border:0;border-radius:10px;padding:10px 22px;cursor:pointer;
 background:linear-gradient(#4d463f,#2a2622);transition:transform .08s,box-shadow .08s;
 box-shadow:0 5px 0 #130f0d,0 9px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #130f0d,0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
button.on{background:linear-gradient(#ffd84a,#e0a800);color:#1a1405;box-shadow:0 5px 0 #8a6500,0 9px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
button:focus-visible{outline:3px solid var(--tape);outline-offset:3px}
#go{margin-top:4px;font-size:26px;padding:16px 80px;letter-spacing:.06em;color:#fff;
 background:linear-gradient(#ff5a4a,#c4231a);
 box-shadow:0 7px 0 #7a120c,0 14px 26px rgba(229,55,44,.45),inset 0 1px 0 rgba(255,255,255,.4)}
#go:active{box-shadow:0 2px 0 #7a120c,0 6px 14px rgba(229,55,44,.45),inset 0 1px 0 rgba(255,255,255,.4)}
#go:disabled{opacity:.55;cursor:wait}
.tip{margin:0;font-size:14px;color:var(--dim);max-width:38em;line-height:1.75}
.tip b{font-weight:800}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div id="menu">
  <div class="glove">🥊</div>
  <h1>카메라 <span>복싱</span></h1>
  <p id="msg">샌드백을 치고, 날아오는 공은 피하세요. 웹캠만 있으면 됩니다.</p>
  <div class="panel">
    <div class="lab">모드</div>
    <div class="row" id="modes"><button data-m="time" class="on">시간제 60초</button><button data-m="score">점수제 300점</button></div>
    <div class="lab">난이도</div>
    <div class="row" id="diffs"><button data-d="easy">하</button><button data-d="mid" class="on">중</button><button data-d="hard">상</button><button data-d="custom">맞춤</button></div>
  </div>
  <button id="go">시작</button>
  <p class="tip">상반신이 다 보이게 카메라에서 1.5~2m 떨어져 서세요.<br>
  샌드백 양옆 불빛이 켜지면 그쪽에서 공이 옵니다.<br>
  <b style="color:#ff6a5c">빨강 = 직선</b> (옆으로 피하기) · <b style="color:#f6c21a">노랑 = 훅</b> (숙이기)<br>
  맞춤: 10초 동안 샌드백을 치면 펀치 빈도·평균 속도에 맞춰 난이도가 정해집니다.</p>
</div>
<script type="module">
import {PoseLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $=id=>document.getElementById(id);
const v=$('v'),cv=$('c'),ctx=cv.getContext('2d');
let W=640,H=360,pose=null,diff='mid',mode='time',state='idle';
// th: 펀치 인정 최소 속도(어깨너비/초), lead: 불빛~발사 지연(초), fly: 비행 시간(초), gap: 공 간격(초)
const DIFF={easy:{th:1.6,lead:.9,fly:1.5,gap:[2.8,4]},mid:{th:2.2,lead:.7,fly:1.1,gap:[2,3]},hard:{th:2.8,lead:.5,fly:.8,gap:[1.2,2.1]}};
const GAME=60,CAP=120,TARGET=300,WARM=10;
const COL={straight:'#e5372c',hook:'#f6c21a'};

let cfg={...DIFF.mid},stat={n:0,s:0};
let score,combo,hits,dodged,balls,tStart,tPlay,tWarm,tEnd,nextBall,lastHit,shake=0,flash=0,floats=[];
let P=null,lastSeen=0,ball=null,lastVT=-1;
const hands=[{sp:0,cool:0},{sp:0,cool:0}];
const bag={a:0,av:0,glow:0};

/* ---------- 소리 ---------- */
let ac=null;
function beep(f,d=.08,type='square',g=.06){if(!ac)return;const o=ac.createOscillator(),k=ac.createGain();
 o.type=type;o.frequency.value=f;k.gain.value=g;k.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
 o.connect(k).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}

/* ---------- 초기화 ---------- */
function fit(){
 const ar=(v.videoWidth||16)/(v.videoHeight||9);let w=innerWidth,h=w/ar;
 if(h>innerHeight){h=innerHeight;w=h*ar}
 cv.width=W=Math.round(w);cv.height=H=Math.round(h);cv.style.width=w+'px';cv.style.height=h+'px';
}
addEventListener('resize',fit);
const msg=t=>$('msg').textContent=t;

async function init(){
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:1280,height:720},audio:false});
 v.srcObject=stream;await v.play();fit();
 msg('동작 인식 모델 불러오는 중…');
 const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 const model="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
 const mk=d=>PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:'VIDEO',numPoses:1});
 try{pose=await mk('GPU')}catch(e){pose=await mk('CPU')}
 requestAnimationFrame(loop);
}

/* ---------- 자세 읽기 ---------- */
function readPose(){
 const r=pose.detectForVideo(v,performance.now());const L=r.landmarks[0];if(!L)return;
 const m=i=>({x:(1-L[i].x)*W,y:L[i].y*H});
 const n=m(0),ls=m(11),rs=m(12),sw=Math.hypot(ls.x-rs.x,ls.y-rs.y);
 if(sw<W*.04)return;
 const t=performance.now()/1000;
 [15,16].forEach((id,i)=>{const w=m(id),h=hands[i],z=L[id].z*W;
  if(h.t!==undefined){const dt=Math.max(.016,t-h.t);
   const s2=Math.hypot(w.x-h.x,w.y-h.y)/dt/sw, sz=Math.max(0,h.z-z)/dt/sw; // 화면 안 속도 + 카메라 쪽 전진 속도
   h.sp=h.sp*.4+Math.hypot(s2,sz)*.6}
  h.x=w.x;h.y=w.y;h.z=z;h.t=t});
 P={n,ls,rs,sw};lastSeen=t;
}

/* ---------- 게임 흐름 ---------- */
function startGame(){
 score=combo=hits=dodged=balls=0;floats=[];ball=null;lastHit=0;stat={n:0,s:0};
 cfg={...DIFF[diff==='custom'?'mid':diff]};
 tStart=performance.now()/1000;state='count';$('menu').classList.add('hide');beep(440,.1);
}
function beginPlay(t){
 if(state==='warm')tune();
 score=combo=hits=dodged=balls=0;floats=[];ball=null;state='play';tPlay=t;
 tEnd=t+(mode==='time'?GAME:CAP);nextBall=t+1.5;beep(660,.15);
}
// 맞춤 난이도: 워밍업 동안의 펀치 빈도와 평균 속도로 설정
function tune(){
 if(stat.n<3){cfg={...DIFF.mid};return}
 const r=stat.n/WARM,a=stat.s/stat.n;
 cfg={th:Math.min(3,Math.max(1.6,a*.6)),lead:.7,fly:Math.min(1.6,Math.max(.8,1.6-(a-2)*.2)),
  gap:[Math.max(1,3.4-r*1.2),Math.max(1.8,4.2-r*1.2)]};
}
function endGame(t){
 const win=mode==='score'&&score>=TARGET,el=t-tPlay;
 let best=0;const key='camboxing_'+mode+'_'+diff;
 try{best=+localStorage.getItem(key)||0;
  if(mode==='time'&&score>best){best=score;localStorage.setItem(key,best)}
  if(mode==='score'&&win&&(!best||el<best)){best=el;localStorage.setItem(key,best)}}catch(e){}
 const bs=mode==='time'?`최고 ${best}점`:(best?`최단 ${(+best).toFixed(1)}초`:'');
 msg(mode==='score'?(win?`${TARGET}점 달성! ${el.toFixed(1)}초`:'시간 초과')+` · 점수 ${score}`:`점수 ${score}`);
 msg($('msg').textContent+` · 펀치 ${hits} · 회피 ${dodged}/${balls} · ${bs}`);
 state='over';$('go').textContent='다시 하기';$('go').disabled=false;$('menu').classList.remove('hide');beep(win?880:220,.4,'sawtooth');
}
function pick(box,attr,set){box.onclick=e=>{const d=e.target.dataset[attr];if(!d)return;set(d);[...box.children].forEach(b=>b.classList.toggle('on',b===e.target))}}
pick($('modes'),'m',d=>mode=d);pick($('diffs'),'d',d=>diff=d);
$('go').onclick=async()=>{
 if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
 if(pose){startGame();return}
 $('go').disabled=true;msg('카메라 켜는 중…');
 try{await init();$('go').disabled=false;startGame()}
 catch(e){console.error(e);$('go').disabled=false;msg('카메라나 모델을 불러오지 못했어요. 주소창의 카메라 권한을 허용하고 새로고침해 주세요.')}
};

/* ---------- 샌드백 (위에서 길게 내려옴) ---------- */
const BW=()=>H*.1,BH=()=>H*.41;
const bagC=()=>({x:W*.5+Math.sin(bag.a)*H*.45,y:H*.45});
const lampPos=s=>({x:W*.5+s*H*.24,y:H*.3});

function hitTest(t){
 if(!P||(state!=='play'&&state!=='warm'))return;
 const bc=bagC(),pad=P.sw*.15,th=state==='warm'?DIFF.mid.th:cfg.th;
 hands.forEach(h=>{
  if(h.x===undefined||t<h.cool||t-lastSeen>.3)return;
  if(Math.abs(h.x-bc.x)<BW()+pad&&Math.abs(h.y-bc.y)<BH()+pad&&h.sp>th){
   h.cool=t+.35;if(t-lastHit>3)combo=0;lastHit=t;
   if(state==='warm'){stat.n++;stat.s+=h.sp}
   const pts=Math.round((10+Math.min(15,(h.sp-th)*5))*(1+Math.min(combo,20)*.05));
   score+=pts;combo++;hits++;
   bag.av+=(bc.x-h.x>=0?1:-1)*Math.min(.9,h.sp*.1);bag.glow=1;
   floats.push({x:h.x,y:h.y,txt:'+'+pts,col:'#f6c21a',t});beep(180+Math.min(300,h.sp*40),.07,'triangle',.15);
  }});
}

/* ---------- 날아오는 공 ---------- */
function launch(t){
 const type=Math.random()<.5?'straight':'hook',side=Math.random()<.5?-1:1;
 ball={type,side,t0:t,tx:P.n.x,ty:P.n.y,fly:cfg.fly,lead:cfg.lead};
 beep(type==='hook'?660:880,.12);
}
function ballPos(b,u){
 if(b.type==='straight'){const l=lampPos(b.side);
  return{x:l.x+(b.tx-l.x)*u,y:l.y+(b.ty-l.y)*u,r:W*(.012+.075*u*u)}}
 const sx=b.side>0?W*1.05:-W*.05; // 훅: 옆에서 큰 호를 그리며 머리로
 return{x:sx+(b.tx-sx)*Math.pow(u,1.3),y:b.ty-Math.sin(Math.PI*u)*H*.22,r:W*(.03+.04*u)}
}
function resolve(t){
 const b=ball;ball=null;nextBall=t+cfg.gap[0]+Math.random()*(cfg.gap[1]-cfg.gap[0]);
 if(!P||t-lastSeen>.6)return;
 balls++;
 const dx=Math.abs(P.n.x-b.tx),dy=P.n.y-b.ty;
 const ok=b.type==='hook'?dy>P.sw*.45:(dx>P.sw*.7||dy>P.sw*.55);
 if(ok){dodged++;score+=20;combo++;lastHit=t;if(diff==='custom')cfg.fly=Math.max(.75,cfg.fly*.97);
  floats.push({x:P.n.x,y:P.n.y-P.sw,txt:'회피! +20',col:'#8fe388',t});beep(1040,.1,'triangle',.12)}
 else{score=Math.max(0,score-15);combo=0;shake=1;flash=1;if(diff==='custom')cfg.fly=Math.min(1.8,cfg.fly*1.06);
  floats.push({x:P.n.x,y:P.n.y-P.sw,txt:'맞았다 -15',col:'#e5372c',t});beep(120,.25,'sawtooth',.15)}
}
function drawLamps(t){
 [-1,1].forEach(s=>{const l=lampPos(s),R=H*.035,on=ball&&ball.side===s&&t-ball.t0<ball.lead&&Math.floor((t-ball.t0)*10)%2===0;
  ctx.fillStyle='#1d1a17';ctx.strokeStyle='#8a8478';ctx.lineWidth=3;ctx.beginPath();ctx.arc(l.x,l.y,R*1.45,0,7);ctx.fill();ctx.stroke();
  if(on){ctx.shadowColor=COL[ball.type];ctx.shadowBlur=45}
  sphere(l.x,l.y,R,on?SC[ball.type]:['#5a544c','#2a2623','#0d0b0a']);ctx.shadowBlur=0});
}
function drawBall(t){
 const b=ball,e=t-b.t0;if(e<b.lead)return;
 const u=Math.min(1,(e-b.lead)/b.fly);
 for(let k=3;k>0;k--){const p=ballPos(b,Math.max(0,u-k*.04));ctx.globalAlpha=.16;ctx.fillStyle=COL[b.type];ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
 ctx.globalAlpha=1;{const p=ballPos(b,u);ctx.shadowColor=COL[b.type];ctx.shadowBlur=p.r*.9;sphere(p.x,p.y,p.r,SC[b.type]);ctx.shadowBlur=0}
 if(u>=1)resolve(t);
}

/* ---------- 그리기 ---------- */
const SC={straight:['#ff9a8e','#e5372c','#5a0b07'],hook:['#fff0a0','#f6c21a','#6b4a00']};
function sphere(x,y,r,c){const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);
 g.addColorStop(0,c[0]);g.addColorStop(.45,c[1]);g.addColorStop(1,c[2]);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(x-r*.35,y-r*.42,r*.22,r*.12,-.6,0,7);ctx.fill()}
function drawBag(){
 const bw=BW(),top=H*.04,bot=H*.86,ry=bw*.28,P2=Math.PI;
 ctx.save();ctx.translate(W*.5,0);ctx.rotate(-bag.a);
 ctx.strokeStyle='#b9b4a8';ctx.lineWidth=5;ctx.lineCap='round';
 [-1,1].forEach(s=>{ctx.beginPath();ctx.moveTo(s*bw*.55,0);ctx.lineTo(0,top);ctx.stroke()});
 const g=ctx.createLinearGradient(-bw,0,bw,0);
 [[0,'#3d0806'],[.2,'#a81f17'],[.38,'#ff5a48'],[.55,'#c82a20'],[.85,'#7a130d'],[1,'#2a0504']].forEach(a=>g.addColorStop(a[0],a[1]));
 ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=H*.04;ctx.shadowOffsetX=H*.02;ctx.shadowOffsetY=H*.01;
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-bw,top);ctx.lineTo(-bw,bot);ctx.ellipse(0,bot,bw,ry,0,P2,0,true);ctx.lineTo(bw,top);ctx.ellipse(0,top,bw,ry,0,0,P2,true);ctx.closePath();ctx.fill();
 ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=ctx.shadowOffsetY=0;
 ctx.fillStyle='#4a0c08';ctx.beginPath();ctx.ellipse(0,top,bw,ry,0,0,7);ctx.fill();
 const tg=ctx.createLinearGradient(-bw,0,bw,0);[[0,'#8a6500'],[.4,'#ffe27a'],[.7,'#f6c21a'],[1,'#7a5800']].forEach(a=>tg.addColorStop(a[0],a[1]));
 [.28,.6].forEach(f=>{const y0=H*f,hb=H*.035;ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(-bw,y0);ctx.ellipse(0,y0,bw,ry,0,P2,0,true);
  ctx.lineTo(bw,y0+hb);ctx.ellipse(0,y0+hb,bw,ry,0,0,P2,false);ctx.closePath();ctx.fill()});
 ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(-bw*.55,top+ry,bw*.14,bot-top-ry*1.5);
 ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=2;ctx.setLineDash([7,9]);
 [-.7,.7].forEach(f=>{ctx.beginPath();ctx.moveTo(bw*f,top+ry);ctx.lineTo(bw*f,bot);ctx.stroke()});ctx.setLineDash([]);
 if(bag.glow>.1){ctx.strokeStyle=`rgba(246,194,26,${bag.glow})`;ctx.lineWidth=8;ctx.shadowColor='#f6c21a';ctx.shadowBlur=30;
  ctx.beginPath();ctx.moveTo(-bw,top);ctx.lineTo(-bw,bot);ctx.ellipse(0,bot,bw,ry,0,P2,0,true);ctx.lineTo(bw,top);ctx.stroke();ctx.shadowBlur=0}
 ctx.restore();
}
function drawPlayer(){
 if(!P||performance.now()/1000-lastSeen>.6)return;
 ctx.strokeStyle='rgba(243,239,230,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(P.n.x,P.n.y,P.sw*.38,0,7);ctx.stroke();
 const th=state==='warm'?DIFF.mid.th:cfg.th;
 hands.forEach(h=>{if(h.x===undefined)return;const fast=h.sp>th,r=P.sw*.22,d=h.x<P.n.x?1:-1;
  if(fast){ctx.shadowColor='#f6c21a';ctx.shadowBlur=32}
  sphere(h.x,h.y,r,SC.straight);ctx.shadowBlur=0;
  sphere(h.x+d*r*.78,h.y+r*.28,r*.4,SC.straight);
  if(fast){ctx.strokeStyle='#f6c21a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(h.x,h.y,r*1.12,0,7);ctx.stroke()}});
}
function txt(s,x,y,size,col,al='center'){ctx.textAlign=al;ctx.fillStyle=col;ctx.font=`900 ${H*size}px sans-serif`;
 ctx.shadowColor='rgba(0,0,0,.75)';ctx.shadowBlur=H*.012;ctx.shadowOffsetY=H*.004;ctx.fillText(s,x,y);ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0}
function plate(x,y,w,h){ctx.fillStyle='rgba(12,9,8,.68)';ctx.strokeStyle='rgba(246,194,26,.65)';ctx.lineWidth=2;ctx.beginPath();
 ctx.roundRect?ctx.roundRect(x,y,w,h,H*.025):ctx.rect(x,y,w,h);ctx.fill();ctx.stroke()}
function hud(t){
 plate(W*.02,H*.02,W*.24,H*.12);plate(W*.84,H*.02,W*.14,H*.12);
 txt(mode==='score'?`${score}/${TARGET}`:score,W*.04,H*.11,.08,'#f3efe6','left');
 if(combo>1)txt(combo+' 콤보',W*.03,H*.2,.05,'#f6c21a','left');
 const left=mode==='time'?Math.max(0,Math.ceil(tEnd-t)):Math.floor(t-tPlay);
 txt(left,W*.97,H*.11,.08,mode==='time'&&left<=10?'#ff5a4a':'#f3efe6','right');
}

/* ---------- 메인 루프 ---------- */
let lastT=0;
function loop(now){
 requestAnimationFrame(loop);
 const t=now/1000,dt=Math.min(.05,t-lastT);lastT=t;
 if(v.readyState<2)return;
 if(v.currentTime!==lastVT){lastVT=v.currentTime;readPose()}
 bag.av+=(-26*Math.sin(bag.a)-3.2*bag.av)*dt;bag.a+=bag.av*dt;bag.glow=Math.max(0,bag.glow-dt*3);
 shake=Math.max(0,shake-dt*3);flash=Math.max(0,flash-dt*2.5);

 ctx.save();
 ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(v,0,0,W,H);ctx.setTransform(1,0,0,1,0,0);
 if(shake>0)ctx.translate((Math.random()-.5)*shake*H*.03,(Math.random()-.5)*shake*H*.03);
 {const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);vg.addColorStop(0,'rgba(20,17,15,.15)');vg.addColorStop(1,'rgba(8,6,5,.72)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
 drawBag();drawLamps(t);

 if(state==='count'){
  const c=3-Math.floor(t-tStart);
  txt(c>0?c:'파이트!',W/2,H*.35,.3,'#f3efe6');
  if(!P)txt('상반신이 보이도록 뒤로 물러나세요',W/2,H*.9,.05,'#f6c21a');
  if(t-tStart>=3.6){if(diff==='custom'){state='warm';tWarm=t+WARM;beep(660,.15)}else beginPlay(t)}
 }
 else if(state==='warm'){
  hitTest(t);
  txt(`샌드백을 마음껏 치세요 ${Math.ceil(tWarm-t)}`,W/2,H*.08,.05,'#f6c21a');
  if(t>=tWarm)beginPlay(t);
 }
 else if(state==='play'){
  hitTest(t);
  if(!ball&&P&&t-lastSeen<.3&&t>nextBall)launch(t);
  if(ball)drawBall(t);
  if(ball&&diff!=='hard')txt(ball.type==='hook'?'훅 — 숙이세요':'직선 — 옆으로 피하세요',W/2,H*.08,.05,COL[ball.type]);
  hud(t);
  if(t-lastSeen>.6)txt('몸이 인식되지 않아요',W/2,H*.92,.05,'#f6c21a');
  if(t>=tEnd||(mode==='score'&&score>=TARGET))endGame(t);
 }
 drawPlayer();
 floats=floats.filter(f=>t-f.t<1);
 floats.forEach(f=>{const a=t-f.t;ctx.globalAlpha=1-a;txt(f.txt,f.x,f.y-a*H*.1,.06,f.col)});
 ctx.globalAlpha=1;
 if(flash>0){ctx.fillStyle=`rgba(229,55,44,${flash*.45})`;ctx.fillRect(0,0,W,H)}
 ctx.restore();
}
</script>
